# ============================================
# VerduleriaCatrinacio - Perfil de Desarrollo
# ============================================

# Base de datos H2 en memoria para desarrollo
spring.datasource.url=jdbc:h2:mem:verduleria_catrinacio_dev
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=DevSecretKeyQueDebeSerMuyLargaParaSerSegura1234567890ABCDEF
app.jwt.expiration=86400000

# Logging
logging.level.com.verduleria.catrinacio=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
